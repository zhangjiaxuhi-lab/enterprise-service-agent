name: secret-scan

# 密钥泄漏防护（服务端兜底）
#
# 为什么需要这一层：
#   .git/hooks/pre-commit 属于**本地**配置，不会被提交，因此：
#     * 其他人 clone 后没有钩子；
#     * 某些受管控的 Windows 环境可能无法执行钩子脚本；
#     * 任何人都可以用 git commit --no-verify 跳过。
#   本地钩子只是"第一道防线"，CI 才是**不可绕过**的兜底。
#
# 本 workflow 与本地钩子共用同一个扫描器 scripts/secret_scan.py，
# 保证两处判定规则完全一致，不存在行为漂移。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史，用于历史扫描）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 扫描当前跟踪文件
        run: python scripts/secret_scan.py --all

      - name: 扫描全部历史提交
        # 历史命中意味着曾经泄漏过：这种情况必须轮换密钥并重写历史，
        # 仅删除文件无效，因此这里同样阻断。
        run: python scripts/secret_scan.py --history
