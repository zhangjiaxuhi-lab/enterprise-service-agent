name: tests

# 自动化测试
#
# 设计要点：
#   * 全部用例默认使用**确定性 mock 模型**，不调用 DashScope、不消耗额度、
#     不需要 API Key —— 因此可以在 CI 中完整运行。
#   * 真实模型测试（@pytest.mark.real_model）默认跳过，仅在需要人工验证
#     「真实 qwen-plus 是否遵守 Prompt」时本地显式执行：pytest -m real_model
#   * 与密钥扫描 workflow 相互独立，任一失败都会阻断合并。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行测试套件
        # pytest.ini 中已设 `-m "not real_model"`，此处无需重复指定
        run: pytest -v
