<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="企业级智能客服与工单协同中枢">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#0f2e2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="markbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="200" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="180" cy="290" r="170" fill="url(#glow)" filter="url(#soft)" opacity="0.7"/>

  <!-- 细网格纹理 -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M80 0 V320 M240 0 V320 M400 0 V320 M560 0 V320 M720 0 V320 M880 0 V320 M1040 0 V320"/>
  </g>

  <!-- 徽标：对话气泡 + 三点 + 连接节点（几何构图，避免复杂路径变形） -->
  <g transform="translate(84, 78)">
    <rect width="72" height="72" rx="20" fill="url(#markbg)"/>
    <g transform="translate(36, 33)">
      <!-- 气泡主体 -->
      <rect x="-17" y="-12" width="34" height="24" rx="8"
            fill="none" stroke="#ffffff" stroke-width="2.6"/>
      <!-- 气泡尾巴 -->
      <path d="M-6 12 L-9 19 L0 12" fill="none" stroke="#ffffff"
            stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 三个点 -->
      <circle cx="-7" cy="0" r="2" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
      <circle cx="7" cy="0" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- 主标题 -->
  <text x="184" y="118" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif"
        font-size="44" font-weight="700" fill="#ffffff" letter-spacing="1">
    企业级智能客服与工单协同中枢
  </text>
  <text x="186" y="156" font-family="'SFMono-Regular',Consolas,monospace"
        font-size="17" fill="#5eead4" letter-spacing="3.2">
    ENTERPRISE SERVICE AGENT
  </text>

  <!-- 副标题 -->
  <text x="186" y="196" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif"
        font-size="16.5" fill="#94a3b8">
    LangGraph 状态机编排 · SSE 流式推理 · RAG 知识库检索 · 企业工单闭环
  </text>

  <!-- 分隔线 -->
  <rect x="186" y="216" width="120" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- 技术标签 -->
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="13.5">
    <g transform="translate(186, 240)">
      <rect width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="56" y="20" fill="#cbd5e1" text-anchor="middle">LangGraph</text>
    </g>
    <g transform="translate(310, 240)">
      <rect width="102" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="51" y="20" fill="#cbd5e1" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(424, 240)">
      <rect width="126" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="63" y="20" fill="#cbd5e1" text-anchor="middle">qwen-plus</text>
    </g>
    <g transform="translate(562, 240)">
      <rect width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="48" y="20" fill="#cbd5e1" text-anchor="middle">SSE</text>
    </g>
    <g transform="translate(670, 240)">
      <rect width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="75" y="20" fill="#cbd5e1" text-anchor="middle">零前端构建</text>
    </g>
  </g>
</svg>
