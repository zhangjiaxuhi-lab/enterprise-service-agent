[pytest]
# 测试目录（默认从 tests/ 收集）
testpaths = tests

# 发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义标记
markers =
    real_model: 需要真实 DASHSCOPE_API_KEY 与网络，默认跳过（用 -m real_model 启用）
    slow: 执行较慢的测试
    anyio: 异步测试（由 anyio 插件提供，后端固定为 asyncio）

# 运行参数
#
# 不使用内置 tmp_path：测试改用 tests/conftest.py 的 tmp_dir fixture（自管理），
# 避免 pytest 在会话结束时扫描 basetemp 而触发受限文件系统报错。
# `-m "not real_model"` 是刻意的默认行为：真实模型测试会消耗额度并依赖网络，
# 因此 CI 与日常开发默认跳过。需要验证「真实 qwen-plus 是否遵守 Prompt」时显式运行：
#     pytest -m real_model
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -m "not real_model"
